name: API Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * *"   # 每天 09:00（UTC+8）跑一次回归
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
